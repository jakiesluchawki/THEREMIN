<!doctype html><html><meta charset="utf-8"><title>AER choir runtime</title><button id="run">Run choir audio checks</button><pre id="result"></pre><script type="module">
import {Theremin} from '/src/audio.ts';import {chordFor,choirVoicing} from '/src/harmony.mjs';
const log=s=>document.querySelector('#result').textContent+=s+'\n';const wait=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;const s=new Theremin();await s.resume();s.setSpace(.4);const data=new Float32Array(8192);s.analyser.fftSize=8192;const metrics=()=>{s.analyser.getFloatTimeDomainData(data);return{rms:Math.sqrt(data.reduce((v,x)=>v+x*x,0)/data.length),peak:Math.max(...data.map(Math.abs))};};try{const chord=chordFor('I',7),notes=choirVoicing(67,chord);s.choir.play(notes,.65,0);await wait(800);let m=metrics();log((m.rms>.003&&m.peak<.8?'PASS':'FAIL')+' single part formant choir RMS '+m.rms.toFixed(5)+' peak '+m.peak.toFixed(3));s.choir.play(notes,.65,1);await wait(900);m=metrics();log((m.rms>.003&&m.peak<.8?'PASS':'FAIL')+' 8-part choir RMS '+m.rms.toFixed(5)+' peak '+m.peak.toFixed(3));log((s.choir.voices===8&&s.choir.parts.length===8?'PASS':'FAIL')+' 8 harmonic parts / '+s.choir.parts.reduce((v,p)=>v+p.oscillators.length,0)+' singer layers');for(let i=0;i<8;i++)log((Math.abs(s.choir.parts[i].oscillators[0].frequency.value-440*2**((notes[i]-69)/12))<.1?'PASS':'FAIL')+' part '+(i+1)+' tuned to chord tone MIDI '+notes[i]);s.choir.setMode('vocoder');s.choir.setExpression(.8);await wait(500);m=metrics();log((m.rms>.003&&m.peak<.8?'PASS':'FAIL')+' vocoder-style voice RMS '+m.rms.toFixed(5)+' peak '+m.peak.toFixed(3));s.choir.silence();s.setSpace(0);await wait(600);log((metrics().rms<.0001?'PASS':'FAIL')+' choir mutes to silence');s.play(69,.4);await wait(500);log((metrics().rms>.003?'PASS':'FAIL')+' classic theremin remains playable');log((s.destination.stream.getAudioTracks().length===1?'PASS':'FAIL')+' choir routed into recording mix');}catch(e){log('FAIL '+e);}finally{await s.ctx.close();log('DONE');}};
</script></html>
