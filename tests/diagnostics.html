<!doctype html><html lang="en"><meta charset="utf-8"><title>AER diagnostics</title><body><h1>AER runtime diagnostics</h1><button id="run">Run audio checks</button><pre id="results">Loading vision worker…</pre><canvas id="frame" width="640" height="480"></canvas><script type="module">
import {Theremin} from '/src/audio.ts';
const out=document.querySelector('#results');const log=s=>out.textContent+='\n'+s;
const worker=new Worker('/tracker.js');
const timeout=setTimeout(()=>log('FAIL vision timeout'),20000);
worker.onerror=e=>{clearTimeout(timeout);log('FAIL worker '+e.message);};
worker.onmessage=async({data})=>{if(data.type==='ready'){log('PASS vision model initialized');const canvas=document.querySelector('canvas');const frame=await createImageBitmap(canvas);worker.postMessage({type:'frame',frame,time:performance.now()},[frame]);}else if(data.type==='result'){if(!window.blankDone){window.blankDone=true;log((data.landmarks.length===0?'PASS':'FAIL')+' blank frame: '+data.landmarks.length+' hands');const image=new Image();image.src='/tests/fixtures/right_hands.jpg';await image.decode();const frame=await createImageBitmap(image);worker.postMessage({type:'frame',frame,time:performance.now()},[frame]);}else{clearTimeout(timeout);log((data.landmarks.length===2?'PASS':'FAIL')+' two-hand fixture: '+data.landmarks.length+' hands, '+Math.round(data.ms)+' ms');worker.terminate();}}else {clearTimeout(timeout);log('FAIL '+data.message);}};
worker.postMessage({type:'init',origin:location.origin});
document.querySelector('#run').onclick=async()=>{const s=new Theremin();await s.resume();s.play(69,.8,.005);await new Promise(r=>setTimeout(r,500));const sample=new Float32Array(4096);s.analyser.fftSize=4096;s.analyser.getFloatTimeDomainData(sample);const rms=Math.sqrt(sample.reduce((v,x)=>v+x*x,0)/sample.length);let cycles=0;for(let i=1;i<sample.length;i++)if(sample[i-1]<0&&sample[i]>=0)cycles++;const hz=cycles/(sample.length/s.ctx.sampleRate);log((rms>.005&&hz>400&&hz<480?'PASS':'FAIL')+' audio: RMS '+rms.toFixed(4)+', ~'+Math.round(hz)+' Hz, context '+s.ctx.state);s.setSpace(0);s.silence();await new Promise(r=>setTimeout(r,500));s.analyser.getFloatTimeDomainData(sample);const silentRms=Math.sqrt(sample.reduce((v,x)=>v+x*x,0)/sample.length);log((silentRms<.001?'PASS':'FAIL')+' silence RMS '+silentRms.toFixed(6));await s.ctx.close();};
</script></body></html>
