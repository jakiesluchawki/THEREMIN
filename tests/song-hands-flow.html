<!doctype html><html lang="pl"><meta charset="utf-8"><title>AER full gesture integration fixture</title><div style="padding:10px;background:#d6e5b6"><button id="test-run">Run separate hand controls</button><pre id="test-log"></pre></div><div id="app"></div><script type="module">

function landmark(p,tilt=0,isVolume=false){const screen=Array.from({length:21},()=>({x:p.x,y:p.y}));const offsets={0:[0,.09],5:[-.04,-.01],9:[0,-.04],13:[.02,-.02],17:[.02,-.02]};for(const i of Object.keys(offsets)){const [dx,dy]=offsets[i];screen[i]={x:p.x+(dx*Math.cos(tilt)-dy*Math.sin(tilt)/1.6),y:p.y+(dx*1.6*Math.sin(tilt)+dy*Math.cos(tilt))};}for(const [m,t]of [[5,8],[9,12],[13,16],[17,20]])screen[t]={x:screen[m].x,y:((isVolume?leftOpening:rightOpening)??opening)>.5?p.y-.23:p.y+.01};screen[4]={x:p.x-.13,y:p.y-.03};const owner=isVolume?'volume':'pitch';if(aimPoint&&aimOwner===owner)screen[8]={...aimPoint};if(pinched&&pinchOwner===owner)screen[4]={...screen[8]};return screen.map(s=>({x:1-s.x,y:s.y,z:0}));}

document.querySelector('#test-run').onclick=async()=>{document.querySelector('#test-run').disabled=true;try{document.querySelector('#start').click();await until(()=>!document.querySelector('#song-gesture-controls').classList.contains('hidden'));await until(()=>window.__fixturePlayers.at(-1)?.playing);window.__fixturePlayers.at(-1).pauseVideo();window.__fixturePlayers.at(-1).seekTo(2);await wait(100);check(!document.querySelector('[data-chord]')&&!document.querySelector('[data-gesture="song-next"]'),'manual chord selection is absent');aimPoint=null;volumePoint={x:.25,y:.5};pitchPoint={x:.75,y:.5};leftOpening=0;rightOpening=0;await wait(650);check(parseInt(document.querySelector('#ensemble-count').textContent)===1,'closed left hand gives one choir part');rightOpening=1;await wait(650);check(parseInt(document.querySelector('#ensemble-count').textContent)===1,'opening only right hand cannot add choir voices');rightOpening=0;leftOpening=1;await wait(800);check(parseInt(document.querySelector('#ensemble-count').textContent)===8,'opening only left hand gives eight choir parts');const volumeBefore=document.querySelector('#volume-percent').textContent;pitchPoint.y=.25;await wait(650);check(document.querySelector('#right-register').textContent.includes('WYSOKO'),'right hand height raises chord register');check(document.querySelector('#volume-percent').textContent===volumeBefore,'right register gesture does not change left-hand volume');check(parseInt(document.querySelector('#ensemble-count').textContent)===8,'right register gesture does not change choir density');pitchPoint={x:.6325,y:.5};await wait(350);const before=document.querySelector('#harmony-chord').textContent;pinchOwner='volume';pinched=true;await wait(350);check(document.querySelector('#harmony-chord').textContent===before,'left pinch cannot select a chord');pinched=false;await wait(150);pinchOwner='pitch';pinched=true;await wait(350);check(document.querySelector('#harmony-chord').textContent===before,'right pinch ers.at(-1).volume-100*10**(-30/20))<1e-7,'backing fader applies dB-to-gain conversion');input.value='-48';input.dispatchEvent(new Event('input',{bubbles:true}));check(window.__fixturePlayers.at(-1).volume===0&&document.querySelector('#backing-volume-value').textContent==='−∞ dB','bottom of backing fader is true silence');document.querySelector('#stop').click();log('DONE');}catch(e){log('FAIL '+e);document.querySelector('#stop').click();}};
