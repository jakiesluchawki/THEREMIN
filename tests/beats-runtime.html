<!doctype html><html><meta charset="utf-8"><title>AER beats runtime</title><button id="run">Run beat audio checks</button><pre id="result"></pre><script type="module">
import {Theremin} from '/src/audio.ts';import {BEATS,BeatPlayer} from '/src/beats.ts';
const log=s=>document.querySelector('#result').textContent+=s+'\n';const wait=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;const s=new Theremin();await s.resume();const beats=new BeatPlayer(s.ctx,s.mix);beats.setVolume(.65);const data=new Float32Array(1024);const rms=()=>{s.analyser.getFloatTimeDomainData(data);return Math.sqrt(data.reduce((v,x)=>v+x*x,0)/data.length);};try{s.play(69,.3);s.setExpression(.9);await wait(500);log((s.filter.frequency.value>4500&&s.vibrato.gain.value>20?'PASS':'FAIL')+' rotation changes filter and vibrato');log((Math.abs(s.voice.frequency.value-440)<.1?'PASS':'FAIL')+' rotation preserves oscillator pitch');s.setExpression(-.9);await wait(500);log((s.filter.frequency.value<1500&&s.vibrato.gain.value<.1?'PASS':'FAIL')+' left rotation darkens sound and removes vibrato');s.setExpression(0);s.silence();await wait(400);for(const b of BEATS){const buf=await beats.load(b.id);const expected=b.bars*240/b.bpm;log((Math.abs(buf.duration-expected)<.001?'PASS':'FAIL')+' '+b.name+' loop duration '+buf.duration.toFixed(6));await beats.select(b.id);while(beats.waiting)await wait(25);let max=0;for(let i=0;i<8;i++){await wait(100);max=Math.max(max,rms());}log((max>.001?'PASS':'FAIL')+' '+b.name+' signal RMS '+max.toFixed(5));}beats.setMuted(true,.65);await wait(400);log((rms()<.0001?'PASS':'FAIL')+' panic mute');beats.stop();const race=beats.select('funk');beats.stop();await race;log((!beats.playing&&!beats.selected?'PASS':'FAIL')+' stop cancels in-flight selection');log((s.destination.stream.getAudioTracks().length===1?'PASS':'FAIL')+' mixed audio recording track');}catch(e){log('FAIL '+e);}finally{beats.stop();await s.ctx.close();log('DONE');}};
</script></html>
